<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECOND — ตลาดของมือสอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a href="#">ความช่วยเหลือ</a>
    <a href="#">เกี่ยวกับเรา</a>
  </div>
</div>

<header>
  <nav>
    <div class="logo"><a href="index.html"><span class="logo-se">SE</span><span class="logo-cond">COND</span></a></div>
    <div class="navlinks" id="navlinks"></div>
    <div class="nav-right" id="navRight"></div>
  </nav>
</header>

<section class="hero">
  <div class="hero-bg-track" id="heroBgTrack"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1>ซื้อขาย<span>ของมือสอง</span>ง่ายๆ</h1>
    <p>ตลาดนัดออนไลน์สำหรับของมือสองทุกหมวดหมู่ ปลอดภัย ราคาคงที่ กดซื้อได้เลย</p>
    <form class="hero-search" id="heroSearchForm">
      <input type="text" id="heroSearchInput" placeholder="ค้นหาสินค้า เช่น โน้ตบุ๊ก, จักรยาน...">
      <button type="submit">ค้นหา</button>
    </form>
  </div>
</section>

<div class="speed-divider"></div>

<section class="cat-band">
  <div class="wrap">
    <div class="cat-marquee-wrap"><div class="cat-marquee-track" id="catGrid"></div></div>
  </div>
</section>

<div class="speed-divider reverse"></div>

<section class="marquee-section">
  <div class="marquee-track" id="marqueeTrack"></div>
</section>

<section class="section" style="padding-top:0;">
  <div class="wrap">
    <div class="section-head">
      <h2>ประกาศล่าสุด</h2>
      <span class="tag" id="latestCount">0 รายการ</span>
    </div>
    <div class="grid" id="latestGrid"></div>
  </div>
</section>

<footer>© 2026 SECOND — BY ANUWAT</footer>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
  renderNav();

  // สร้างแถบรูปพื้นหลัง hero เลื่อนไปทางซ้ายไม่รู้จบ (ต่อ array 2 รอบให้ลูปต่อเนื่อง)
  const HERO_BG_IMAGES = [
    'img/hero/com.png', 'img/hero/shirt.png', 'img/hero/krua.png',
    'img/hero/car.png', 'img/hero/keela.png', 'img/hero/sasom.png', 'img/hero/read.png'
  ];
  const heroBgTrack = document.getElementById('heroBgTrack');
  if(heroBgTrack){
    const doubled = [...HERO_BG_IMAGES, ...HERO_BG_IMAGES];
    heroBgTrack.innerHTML = doubled.map(src => `<img src="${src}" alt="">`).join('');
  }

  // สร้างหมวดหมู่จาก CATEGORY_ICONS อัตโนมัติ (ตอนนี้ใช้รูปภาพแทน emoji แล้ว)
  // ต่อ array 2 รอบเพื่อให้เลื่อนวนลูปได้ต่อเนื่องไม่มีรอยต่อ (เหมือนแถบสินค้าเลื่อน)
  const catGrid = document.getElementById('catGrid');
  const catEntries = [...Object.entries(CATEGORY_ICONS), ...Object.entries(CATEGORY_ICONS)];
  catGrid.innerHTML = catEntries.map(([name, iconPath], i) => `
    <a href="category.html?category=${encodeURIComponent(name)}" class="cat-tile" style="animation-delay:${(i % 8) * 0.05}s">
      <div class="cat-tile-img">
        <img src="${iconPath}" alt="${name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="cat-tile-fallback" style="display:none;">${name.charAt(0)}</div>
      </div>
      <div class="name">${name}</div>
    </a>
  `).join('');

  // โหลดประกาศล่าสุดจาก backend จริง
  showSkeleton('latestGrid', 8);
  API.getListings().then(items => {
    const latest = items.slice(0, 8);
    renderMarquee('marqueeTrack', latest);
    renderListingGrid('latestGrid', latest);
    document.getElementById('latestCount').textContent = items.length + ' รายการ';
  }).catch(err => {
    console.error(err);
    document.getElementById('latestGrid').innerHTML = `
      <div class="empty-state">
        <div class="big">⚠️</div>
        <strong>เชื่อมต่อ backend ไม่ได้</strong>
        <p style="margin-top:6px;">เช็คว่ารัน "npm run dev" ที่โฟลเดอร์ backend อยู่ไหม (ดูวิธีใน README.md)</p>
      </div>
    `;
  });

  document.getElementById('heroSearchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = document.getElementById('heroSearchInput').value.trim();
    if(q) window.location.href = 'category.html?q=' + encodeURIComponent(q);
  });
</script>
</body>
</html>
