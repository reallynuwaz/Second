<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — SECOND</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <nav>
    <div class="logo"><a href="index.html"><span class="logo-se">SE</span><span class="logo-cond">COND</span></a></div>
    <div class="navlinks" id="navlinks"></div>
    <div class="nav-right" id="navRight"></div>
  </nav>
</header>

<div class="form-wrap">
  <div class="form-card">
    <h1>เข้าสู่ระบบ</h1>
    <p class="form-sub">เข้าสู่ระบบเพื่อลงขายสินค้าหรือติดต่อผู้ขาย</p>

    <div class="form-msg" id="formMsg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">อีเมล</label>
        <input type="email" id="email" required placeholder="name@email.com">
      </div>
      <div class="field">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">เข้าสู่ระบบ</button>
    </form>

    <p class="form-switch">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
  </div>
</div>

<footer>© 2026 SECOND — BY ANUWAT</footer>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
  renderNav();
  if(isLoggedIn()) window.location.href = 'index.html';

  const form = document.getElementById('loginForm');
  const msgEl = document.getElementById('formMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'กำลังเข้าสู่ระบบ...';
    try{
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const data = await API.login(email, password);
      saveAuth(data.token, data.user);
      window.location.href = 'index.html';
    }catch(err){
      msgEl.textContent = err.message;
      msgEl.className = 'form-msg show error';
      submitBtn.disabled = false;
      submitBtn.textContent = 'เข้าสู่ระบบ';
    }
  });
</script>
</body>
</html>
